name: AI Agent for software testing
description: "Runs AI Agent for software testing"
branding:
  icon: "fast-forward"
  color: "purple"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6

    - name: "[diag] Snapshot WOPEE_ env vars and runtime image"
      shell: bash
      run: |
        echo "::group::WOPEE_ environment variables (initial)"
        # Secrets are redacted at snapshot time: these files feed the job log AND the
        # diagnostic webhook payload, so credential values must never land in them.
        env | grep '^WOPEE_' | sort \
          | sed -E 's/^(WOPEE_[A-Za-z0-9_]*(KEY|TOKEN|SECRET|PASSWORD)[A-Za-z0-9_]*)=.+/\1=***REDACTED***/' \
          > /tmp/wopee_env_initial.txt
        cat /tmp/wopee_env_initial.txt || echo "(none)"
        echo "::endgroup::"

        echo "::group::Runtime image info"
        # Image the container was started from
        if [ -f /etc/os-release ]; then
          echo "--- /etc/os-release ---"
          cat /etc/os-release
        fi
        # Docker image ID baked into the container (if available)
        if [ -f /.docker-image-id ]; then
          echo "--- /.docker-image-id ---"
          cat /.docker-image-id
        fi
        # wopee_agent binary metadata
        if command -v wopee_agent &>/dev/null; then
          AGENT_BIN=$(command -v wopee_agent)
          echo "wopee_agent path: $AGENT_BIN"
          echo "wopee_agent mtime: $(stat -c '%y' "$AGENT_BIN" 2>/dev/null || stat -f '%Sm' "$AGENT_BIN" 2>/dev/null || echo 'unknown')"
          echo "wopee_agent sha256: $(sha256sum "$AGENT_BIN" 2>/dev/null | cut -d' ' -f1 || shasum -a 256 "$AGENT_BIN" 2>/dev/null | cut -d' ' -f1 || echo 'unknown')"
        else
          echo "wopee_agent binary not found in PATH"
        fi
        # Container hostname as runner identifier
        echo "hostname: $(hostname)"
        echo "::endgroup::"

        echo "::group::Container identity and resources"
        echo "hostname: $(hostname)"
        echo "runner name: ${RUNNER_NAME:-unknown}"
        echo "host uptime: $(cut -d' ' -f1 /proc/uptime 2>/dev/null || echo 'unknown')s"
        echo "container started: $(stat -c '%y' /proc/1 2>/dev/null || echo 'unknown')"
        echo "container age: $(( $(date +%s) - $(stat -c '%Y' /proc/1 2>/dev/null || echo 0) ))s"
        echo "disk usage (/tmp): $(df -h /tmp 2>/dev/null | tail -1 || echo 'unknown')"
        echo "memory: $(free -m 2>/dev/null | grep Mem | awk '{print $3"/"$2" MB"}' || echo 'unknown')"
        echo "::endgroup::"

        echo "::group::Network and proxy"
        echo "HTTP_PROXY=${HTTP_PROXY:-unset}"
        echo "HTTPS_PROXY=${HTTPS_PROXY:-unset}"
        echo "NO_PROXY=${NO_PROXY:-unset}"
        curl -s -o /dev/null -w "github.com: HTTP %{http_code} in %{time_total}s\n" https://github.com 2>/dev/null || echo "github.com unreachable"
        curl -s -o /dev/null -w "ghcr.io: HTTP %{http_code} in %{time_total}s\n" https://ghcr.io 2>/dev/null || echo "ghcr.io unreachable"
        echo "::endgroup::"

    - name: Set default values for environment variables
      shell: bash
      run: |
        echo "WOPEE_SCREENSHOT_VALIDATION_ENABLED=${WOPEE_SCREENSHOT_VALIDATION_ENABLED:-true}" >> $GITHUB_ENV
        echo "WOPEE_COLLECT_PAGE_CONTENT=${WOPEE_COLLECT_PAGE_CONTENT:-true}" >> $GITHUB_ENV
        echo "WOPEE_AGENT_WORK_DIR=${WOPEE_AGENT_WORK_DIR:-/tmp/agent}" >> $GITHUB_ENV
        # Bounds on the agent's calls to the Wopee API (backlog#4483). The SDK reads these
        # through wopee.pw's envConfigAdapter; nothing set them, so every run fell to the
        # compiled defaults of 180s x 3 attempts = 543s for a single call — LONGER than the
        # 420s tool watchdog sitting outside it, so the budgets were inverted and the
        # watchdog fired first on a call the SDK was still willing to wait for.
        #
        # 150s x 2 attempts = 301s now fits under the watchdog with 119s to spare, and sits
        # above the api's own ~125s worst case for visualAssert, so a healthy call is never
        # cut. Set here rather than in the api's dispatch payload so the agent is
        # self-bounding with no api release and on every dispatch path — the
        # client_payload.env step below runs AFTER this one, so an api-supplied value still
        # wins.
        echo "WOPEE_API_TIMEOUT_MS=${WOPEE_API_TIMEOUT_MS:-150000}" >> $GITHUB_ENV
        echo "WOPEE_API_MAX_RETRIES=${WOPEE_API_MAX_RETRIES:-1}" >> $GITHUB_ENV

    - name: Load client_payload.env → $GITHUB_ENV
      if: github.event.client_payload.env
      shell: bash
      run: |
        jq -r '
          .client_payload.env
          | to_entries[]
          | select(.value != null)
          | if (.value | type=="string" and test("\n"))
              then "\(.key)<<EOF\n\(.value)\nEOF"
              else "\(.key)=\(.value)"
            end
        ' "$GITHUB_EVENT_PATH" >> "$GITHUB_ENV"

    # Bind this execution to its Actions run NOW, not at the end (backlog#4382).
    #
    # The api creates the ExecutedTestCase row before it fires repository_dispatch, but that
    # POST returns 204 with no body — so the api never learns which Actions run picked the
    # dispatch up. Until this step existed the pairing was only reported by postProcessAgentSuite
    # once the run was already over. Callers had to guess their run out of a gh run list poll
    # (racy the moment two dispatches overlap), the Logs tab sat on "pending" for the whole run,
    # and a run that died before post-processing never reported the id at all.
    #
    # Deliberately best-effort: this is bookkeeping, and a test run must never fail because of
    # it. continue-on-error covers a non-zero exit, the trailing || covers everything else.
    - name: Attach GitHub Actions run to the execution
      if: env.WOPEE_EXECUTED_TEST_CASE_UUID != '' && env.WOPEE_API_URL != ''
      continue-on-error: true
      shell: bash
      run: |
        QUERY='mutation($input: AttachAgentRunInput!) { attachAgentRun(input: $input) { ok attached } }'

        JSON_PAYLOAD="$(jq -n \
          --arg query "$QUERY" \
          --arg executedTestCaseUuid "${WOPEE_EXECUTED_TEST_CASE_UUID}" \
          --arg projectUuid "${WOPEE_PROJECT_UUID:-}" \
          --arg githubRunId "${GITHUB_RUN_ID}" \
          --argjson githubRunAttempt "${GITHUB_RUN_ATTEMPT:-1}" \
          '{
            query: $query,
            variables: {
              input: {
                executedTestCaseUuid: $executedTestCaseUuid,
                projectUuid: $projectUuid,
                githubRunId: $githubRunId,
                githubRunAttempt: $githubRunAttempt
              }
            }
          }'
        )"

        curl --fail-with-body --silent --show-error \
          --request POST --max-time 15 \
          --retry 2 --retry-delay 2 \
          --header "content-type: application/json" \
          --header "api_key: ${WOPEE_API_KEY}" \
          --header "projectuuid: ${WOPEE_PROJECT_UUID:-}" \
          --url "${WOPEE_API_URL}" \
          --data "$JSON_PAYLOAD" \
          || echo "::warning::Could not attach run ${GITHUB_RUN_ID} to execution ${WOPEE_EXECUTED_TEST_CASE_UUID}; its log may be unreachable from Wopee."

    - name: Load .github/workflows/.env → $GITHUB_ENV
      shell: bash
      run: |
        if [ -f .github/workflows/.env ]; then
          # Extract valid KEY=VALUE lines; if none are found, skip without failing the step
          grep -vE '^(#|$)' .github/workflows/.env | \
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=' \
            >> "$GITHUB_ENV" || true
        fi

    - name: Install dependencies
      # Project node_modules only. No `npx playwright install` here on purpose: agent
      # runs execute pw-agent out of WOPEE_AGENT_WORK_DIR with the image-baked browsers
      # (PLAYWRIGHT_BROWSERS_PATH), never the project's Playwright — downloading the
      # project's browser build burned ~1.2 GB of /tmp tmpfs per run for nothing.
      shell: bash
      run: |
        npm install --prefer-offline --no-audit

    - name: Set analysis suite parameters & test case to run
      shell: bash
      run: |
        if [ -n "${{ github.event.client_payload.analysisSuiteUuid }}" ]; then
          echo "WOPEE_ANALYSIS_SUITE_UUID=${{ github.event.client_payload.analysisSuiteUuid }}" >> $GITHUB_ENV
        fi

        if [ -n "${{ github.event.client_payload.suite.name }}" ]; then
          echo "WOPEE_SUITE_NAME=${{ github.event.client_payload.suite.name }}" >> $GITHUB_ENV
        fi

        if [ -n "${{ github.event.client_payload.suite.uuid }}" ]; then
          echo "WOPEE_SUITE_UUID=${{ github.event.client_payload.suite.uuid }}" >> $GITHUB_ENV

          if [ "${{ github.event.action }}" = "crawl" ]; then
            echo "WOPEE_ANALYSIS_SUITE_UUID=${{ github.event.client_payload.suite.uuid }}" >> $GITHUB_ENV
          fi
        fi

        if [ -n "${{ github.event.client_payload.testCase.testCaseId }}" ]; then
          echo "WOPEE_TEST_CASE_ID=${{ github.event.client_payload.testCase.testCaseId }}" >> $GITHUB_ENV
        fi

        if [ -n "${{ github.event.client_payload.testCase.userStoryId }}" ]; then
          echo "WOPEE_USER_STORY_ID=${{ github.event.client_payload.testCase.userStoryId }}" >> $GITHUB_ENV
        fi

    - name: Setup XVFB for headed mode
      if: env.HEADED == 'true'
      shell: bash
      run: |
        if ! command -v xvfb-run &>/dev/null; then
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb 2>/dev/null \
            || apt-get update -qq && apt-get install -y -qq xvfb 2>/dev/null \
            || echo "⚠️ Could not install xvfb — headed mode may fail"
        fi

    - name: "[diag] Compare WOPEE_ env vars before agent execution"
      shell: bash
      run: |
        echo "::group::WOPEE_ environment variables (pre-execution)"
        # Same redaction as the initial snapshot, so the diff below stays meaningful.
        env | grep '^WOPEE_' | sort \
          | sed -E 's/^(WOPEE_[A-Za-z0-9_]*(KEY|TOKEN|SECRET|PASSWORD)[A-Za-z0-9_]*)=.+/\1=***REDACTED***/' \
          > /tmp/wopee_env_pre_exec.txt
        cat /tmp/wopee_env_pre_exec.txt
        echo "::endgroup::"

        echo "::group::WOPEE_ env diff (initial vs pre-execution)"
        if [ -f /tmp/wopee_env_initial.txt ]; then
          DIFF=$(diff /tmp/wopee_env_initial.txt /tmp/wopee_env_pre_exec.txt) || true
          if [ -n "$DIFF" ]; then
            echo "CHANGED variables detected:"
            echo "$DIFF"
          else
            echo "No changes — all WOPEE_ variables are identical to initial snapshot."
          fi
        else
          echo "Initial snapshot not found — skipping diff."
        fi
        echo "::endgroup::"

        echo "::group::Agent work dir state"
        WORK_DIR="${WOPEE_AGENT_WORK_DIR:-/tmp/agent}"
        if [ -d "$WORK_DIR/.git" ]; then
          echo "Git repo at: $WORK_DIR"
          echo "Branch: $(git -C "$WORK_DIR" branch --show-current 2>/dev/null || echo 'unknown')"
          echo "HEAD: $(git -C "$WORK_DIR" log -1 --format='%H %s' 2>/dev/null || echo 'unknown')"
          GIT_REMOTE_URL=$(git -C "$WORK_DIR" remote get-url origin 2>/dev/null | sed 's|x-access-token:[^@]*@|x-access-token:REDACTED@|' || echo 'unknown')
          echo "Remote URL: $GIT_REMOTE_URL"
          echo "Last fetch: $(stat -c '%y' "$WORK_DIR/.git/FETCH_HEAD" 2>/dev/null || echo 'never fetched')"
          echo "--- git extraheader config ---"
          git -C "$WORK_DIR" config --local --get-all http.https://github.com/.extraheader 2>/dev/null | sed 's/AUTHORIZATION: basic .*/AUTHORIZATION: basic [REDACTED]/' || echo "(none)"
          echo "--- git reflog (last 5) ---"
          git -C "$WORK_DIR" reflog --format='%h %gd %gs' -5 2>/dev/null || echo "(no reflog)"
          echo "--- origin/main vs HEAD ---"
          ORIGIN_MAIN=$(git -C "$WORK_DIR" rev-parse origin/main 2>/dev/null || echo 'unknown')
          LOCAL_HEAD=$(git -C "$WORK_DIR" rev-parse HEAD 2>/dev/null || echo 'unknown')
          echo "origin/main: $ORIGIN_MAIN"
          echo "HEAD:        $LOCAL_HEAD"
          if [ "$ORIGIN_MAIN" != "$LOCAL_HEAD" ]; then
            echo "MISMATCH: HEAD is behind or diverged from origin/main"
            git -C "$WORK_DIR" log --oneline "$LOCAL_HEAD..$ORIGIN_MAIN" 2>/dev/null | head -5 || true
          fi
          echo "--- live fetch test ---"
          # Only meaningful when the repo itself carries credentials (baked extraheader).
          # When auto-update runs with WOPEE_AGENT_AUTO_UPDATE_ACCESS_TOKEN, wopee_agent
          # injects the token into the remote URL itself — an unauthenticated probe here
          # would report FAILED on every run and mask real outages.
          FETCH_OUTPUT=""
          if git -C "$WORK_DIR" config --local --get-all http.https://github.com/.extraheader >/dev/null 2>&1; then
            FETCH_OUTPUT=$(git -C "$WORK_DIR" fetch --dry-run origin main 2>&1) && FETCH_STATUS="ok" || FETCH_STATUS="FAILED"
          elif [ -n "${WOPEE_AGENT_AUTO_UPDATE_ACCESS_TOKEN:-}" ]; then
            FETCH_STATUS="SKIPPED_TOKEN_AUTH"
          else
            FETCH_STATUS="SKIPPED_NO_CREDS"
          fi
          echo "fetch dry-run: $FETCH_STATUS"
          if [ "$FETCH_STATUS" = "FAILED" ]; then
            echo "$FETCH_OUTPUT"
          fi
        else
          GIT_REMOTE_URL="n/a"
          FETCH_STATUS="n/a"
          FETCH_OUTPUT=""
          echo "$WORK_DIR is not a git repo (or does not exist yet)"
        fi
        echo "::endgroup::"

        echo "::group::Agent code fingerprint"
        if [ -d "$WORK_DIR" ]; then
          echo "package.json version: $(jq -r '.version // "n/a"' "$WORK_DIR/package.json" 2>/dev/null || echo 'missing')"
          echo "package-lock sha256: $(sha256sum "$WORK_DIR/package-lock.json" 2>/dev/null | cut -d' ' -f1 || echo 'missing')"
          echo "Source tree hash: $(git -C "$WORK_DIR" rev-parse HEAD:src 2>/dev/null || echo 'unknown')"
          echo "node_modules fingerprint: $(find "$WORK_DIR/node_modules" -name 'package.json' -maxdepth 2 -exec md5sum {} + 2>/dev/null | sort | md5sum | cut -d' ' -f1 || echo 'unknown')"
        else
          echo "$WORK_DIR does not exist"
        fi
        echo "::endgroup::"

        echo "::group::Playwright browsers"
        echo "project: $(npx playwright --version 2>/dev/null || echo 'playwright CLI not available')"
        echo "agent:   $(cd "$WORK_DIR" 2>/dev/null && npx --no-install playwright --version 2>/dev/null || echo 'unknown')"
        BROWSERS_DIR="${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
        ls -la "$BROWSERS_DIR" 2>/dev/null || echo "No browsers at $BROWSERS_DIR"
        # WHICH binary interactive mode actually drives. In interactive runs the
        # browser is shell-launched as `chrome` from PATH, not launched by
        # Playwright, and that symlink is built in runtime/Dockerfile.base from a
        # filesystem walk. Nothing has ever recorded what it resolves to, so
        # "the agent drives the build Playwright was made against" has been an
        # assumption for the life of the CDP path.
        CHROME_BIN="$(command -v chrome 2>/dev/null || echo '')"
        if [ -n "$CHROME_BIN" ]; then
          echo "chrome on PATH: $CHROME_BIN -> $(readlink -f "$CHROME_BIN")"
          echo "chrome --version: $("$CHROME_BIN" --version 2>/dev/null || echo 'unavailable')"
        else
          echo "chrome not on PATH (standard/headless mode launches via Playwright)"
        fi
        echo "::endgroup::"

        echo "::group::Diagnostic fingerprint (JSON)"
        AGENT_BIN_PATH="$(command -v wopee_agent 2>/dev/null || echo '')"
        DIAG_JSON=$(jq -n \
          --arg hostname "$(hostname)" \
          --arg runner "${RUNNER_NAME:-unknown}" \
          --arg agent_sha "$([ -n "$AGENT_BIN_PATH" ] && sha256sum "$AGENT_BIN_PATH" 2>/dev/null | cut -d' ' -f1 || echo 'unknown')" \
          --arg head "$(git -C "$WORK_DIR" rev-parse HEAD 2>/dev/null || echo 'unknown')" \
          --arg lockfile_sha "$(sha256sum "$WORK_DIR/package-lock.json" 2>/dev/null | cut -d' ' -f1 || echo 'unknown')" \
          --arg pkg_version "$(jq -r '.version // "n/a"' "$WORK_DIR/package.json" 2>/dev/null || echo 'unknown')" \
          --arg pw_version "$(npx playwright --version 2>/dev/null || echo 'unknown')" \
          --arg agent_pw_version "$(cd "$WORK_DIR" 2>/dev/null && npx --no-install playwright --version 2>/dev/null || echo 'unknown')" \
          --arg host_uptime "$(cut -d' ' -f1 /proc/uptime 2>/dev/null || echo 'unknown')" \
          --arg container_started "$(stat -c '%y' /proc/1 2>/dev/null || echo 'unknown')" \
          --arg container_age_sec "$(( $(date +%s) - $(stat -c '%Y' /proc/1 2>/dev/null || echo 0) ))" \
          --arg disk_free "$(df -h /tmp 2>/dev/null | tail -1 | awk '{print $4}' || echo 'unknown')" \
          --arg mem_used "$(free -m 2>/dev/null | grep Mem | awk '{print $3"/"$2}' || echo 'unknown')" \
          --arg last_fetch "$(stat -c '%y' "$WORK_DIR/.git/FETCH_HEAD" 2>/dev/null || echo 'never')" \
          --arg git_remote_url "$GIT_REMOTE_URL" \
          --arg git_extraheader "$(git -C "$WORK_DIR" config --local --get-all http.https://github.com/.extraheader 2>/dev/null && echo 'present' || echo 'none')" \
          --arg git_origin_main "$(git -C "$WORK_DIR" rev-parse origin/main 2>/dev/null || echo 'unknown')" \
          --arg git_fetch_test "${FETCH_STATUS:-unknown}" \
          --arg git_fetch_error "$([ "${FETCH_STATUS:-}" = "FAILED" ] && echo "$FETCH_OUTPUT" || echo '')" \
          --arg env_vars_changed "$([ -f /tmp/wopee_env_initial.txt ] && diff -q /tmp/wopee_env_initial.txt /tmp/wopee_env_pre_exec.txt >/dev/null 2>&1 && echo 'false' || echo 'true')" \
          --arg wopee_env "$(cat /tmp/wopee_env_pre_exec.txt 2>/dev/null || echo '')" \
          --arg github_run_id "${GITHUB_RUN_ID:-unknown}" \
          --arg github_run_url "${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-unknown}/actions/runs/${GITHUB_RUN_ID:-0}" \
          --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          '{timestamp: $timestamp, hostname: $hostname, runner: $runner, github_run_id: $github_run_id, github_run_url: $github_run_url, agent_binary_sha256: $agent_sha, git_head: $head, git_origin_main: $git_origin_main, git_remote_url: $git_remote_url, git_extraheader: $git_extraheader, git_fetch_test: $git_fetch_test, git_fetch_error: $git_fetch_error, pkg_version: $pkg_version, lockfile_sha256: $lockfile_sha, playwright: $pw_version, playwright_agent: $agent_pw_version, host_uptime_sec: $host_uptime, container_started: $container_started, container_age_sec: $container_age_sec, disk_free: $disk_free, mem_mb: $mem_used, last_git_fetch: $last_fetch, env_vars_changed: $env_vars_changed, wopee_env: $wopee_env}')
        echo "$DIAG_JSON"
        echo "::endgroup::"

        echo "::group::POST diagnostic fingerprint to webhook"
        # Payload contains only redacted env (see the snapshot steps) plus non-secret
        # fingerprints. Opt-in by destination: nothing is sent unless the runner
        # supplies WOPEE_DIAG_WEBHOOK_URL, so an environment that must not reach
        # our cloud (an air-gapped tenant) is off simply by leaving it unset, and
        # a tenant with its own collector can point this at that instead.
        if [ -z "${WOPEE_DIAG_WEBHOOK_URL:-}" ]; then
          echo "Webhook POST skipped (WOPEE_DIAG_WEBHOOK_URL is not set)"
        else
          curl -s -o /dev/null -w "Webhook POST: HTTP %{http_code}\n" \
            --request POST \
            --header "content-type: application/json" \
            --data "$DIAG_JSON" \
            "$WOPEE_DIAG_WEBHOOK_URL" \
            || echo "Warning: webhook POST failed"
        fi
        echo "::endgroup::"

    - name: Start Chrome with CDP
      if: env.AGENT_MODE == 'interactive'
      shell: bash
      run: |
        nohup chrome \
          --headless=new \
          --ignore-certificate-errors \
          --remote-debugging-address=127.0.0.1 \
          --remote-debugging-port=9222 \
          --user-data-dir=/tmp/chrome-cdp \
          --remote-allow-origins=* \
          --no-sandbox \
          --disable-dev-shm-usage \
          --disable-gpu \
          --window-size=1280,863 \
          >/tmp/chrome.out 2>&1 &

        for i in {1..20}; do
          if curl -sf http://127.0.0.1:9222/json/version >/dev/null; then break; fi
          sleep 0.3
        done

        # The readiness probe already asks Chrome to identify itself and threw
        # the answer away. It carries the browser build and the CDP protocol
        # version — the two facts that say whether this browser is the one
        # Playwright was built against, which no run has ever recorded.
        echo "::group::Chrome identity"
        curl -s http://127.0.0.1:9222/json/version || echo "could not read /json/version"
        echo
        echo "::endgroup::"

    - name: Register browser session with API relay
      if: env.AGENT_MODE == 'interactive'
      shell: bash
      run: |
        set -euo pipefail

        TARGET_ID=$(curl -s http://127.0.0.1:9222/json/list | jq -r 'map(select(.type=="page")) | .[0].id // empty')
        [ -z "$TARGET_ID" ] && { echo "::error::No page target found in Chrome CDP"; exit 1; }

        RESPONSE=$(curl -sf -X POST "${WOPEE_API_URL}" \
          -H "Content-Type: application/json" \
          -H "api_key: ${WOPEE_API_KEY}" \
          -H "projectuuid: ${WOPEE_PROJECT_UUID}" \
          -d '{
            "query": "mutation($input: CreateBrowserSessionInput!) { createBrowserSession(input: $input) { sid agentToken agentRelayUrl viewerRelayUrl } }",
            "variables": {
              "input": {
                "executedTestCaseUuid": "'"${WOPEE_EXECUTED_TEST_CASE_UUID}"'",
                "projectUuid": "'"${WOPEE_PROJECT_UUID}"'"
              }
            }
          }')

        SID=$(echo "$RESPONSE" | jq -r '.data.createBrowserSession.sid')
        AGENT_TOKEN=$(echo "$RESPONSE" | jq -r '.data.createBrowserSession.agentToken')
        AGENT_RELAY_URL=$(echo "$RESPONSE" | jq -r '.data.createBrowserSession.agentRelayUrl')
        VIEWER_RELAY_URL=$(echo "$RESPONSE" | jq -r '.data.createBrowserSession.viewerRelayUrl')

        [ "$SID" = "null" ] && { echo "::error::Failed to create browser session: $(echo $RESPONSE | jq -r '.errors[0].message // "unknown"')"; exit 1; }

        echo "PROXY_TARGET_ID=${TARGET_ID}" >> "$GITHUB_ENV"
        echo "CDP_SESSION_SID=${SID}" >> "$GITHUB_ENV"
        echo "CDP_AGENT_TOKEN=${AGENT_TOKEN}" >> "$GITHUB_ENV"
        echo "CDP_AGENT_RELAY_URL=${AGENT_RELAY_URL}" >> "$GITHUB_ENV"
        echo "BROWSER_WSS_ENDPOINT=${VIEWER_RELAY_URL}" >> "$GITHUB_ENV"
        echo "::notice title=CDP Session::sid=${SID}"

    - name: Start CDP session proxy
      if: env.AGENT_MODE == 'interactive'
      shell: bash
      run: |
        if ! command -v cdp-session-proxy &>/dev/null; then
          echo "::error::cdp-session-proxy not found on PATH. Runtime image is stale; rebuild ghcr.io/autonomous-testing/runtime so it ships the preinstalled binary."
          exit 1
        fi

        nohup cdp-session-proxy start \
          --chrome-port 9222 \
          --proxy-port 9223 \
          --multi-client \
          --no-viewer \
          --uplink-url "${CDP_AGENT_RELAY_URL}" \
          --uplink-token "${CDP_AGENT_TOKEN}" \
          --uplink-target "${PROXY_TARGET_ID}" \
          --output /tmp/recordings \
          >/tmp/proxy.out 2>&1 &

        for i in {1..20}; do
          if bash -c 'echo > /dev/tcp/127.0.0.1/9223' 2>/dev/null; then break; fi
          sleep 0.3
        done
        if ! bash -c 'echo > /dev/tcp/127.0.0.1/9223' 2>/dev/null; then
          echo "::error::cdp-session-proxy failed to start. Check /tmp/proxy.out for details."
          cat /tmp/proxy.out 2>/dev/null || true
          exit 1
        fi
        echo "CDP session proxy ready (uplink mode)"

    - name: Route agent through proxy
      if: env.AGENT_MODE == 'interactive'
      shell: bash
      run: |
        echo "DEVTOOLS_URL=ws://127.0.0.1:9223/devtools/agent/${PROXY_TARGET_ID}" >> "$GITHUB_ENV"

    - name: Run agent
      id: run-agent
      shell: bash
      run: |
        env | grep '^WOPEE_' | sort || echo "No WOPEE_ variables found"

        # On cancellation/timeout, GitHub sends SIGTERM but skips remaining
        # composite action steps (even with `if: always()`). This trap ensures
        # CMD is notified so the run doesn't stay "In progress" forever.
        notify_cmd_on_cancel() {
          echo "⚠️ Agent process terminated — notifying CMD..."

          if [ "${{ github.event.action }}" = "crawl" ]; then
            MUTATION="PostProcessAnalysisSuite"
            INPUT_TYPE="PostProcessAnalysisSuiteInput"
            SELECTION="{ postProcessing errorMessage }"
          else
            MUTATION="PostProcessAgentSuite"
            INPUT_TYPE="PostProcessAgentSuiteInput"
            SELECTION="{ postProcessing errorMessage }"
          fi

          JSON_PAYLOAD=$(cat <<-EOF
          {
            "query": "mutation ${MUTATION}(\$input: ${INPUT_TYPE}!) { ${MUTATION}(input: \$input) ${SELECTION} }",
            "variables": {
              "input": {
                "error": true,
                "projectUuid": "${{ env.WOPEE_PROJECT_UUID }}",
                "suiteUuid": "${{ env.WOPEE_SUITE_UUID }}"
              }
            }
          }
        EOF
          )

          curl --request POST --max-time 20 \
            --retry 3 --retry-delay 2 \
            --header 'content-type: application/json' \
            --header 'api_key: ${{ env.WOPEE_API_KEY }}' \
            --url '${{ env.WOPEE_API_URL }}' \
            --data "$JSON_PAYLOAD" \
            2>/dev/null || echo "⚠️ CMD notification failed"

          exit 1
        }
        trap notify_cmd_on_cancel SIGTERM SIGINT

        # Run agent in background so the shell stays alive to receive signals.
        if [ "$HEADED" = "true" ] && command -v xvfb-run &>/dev/null; then
          echo "🖥️ Running in headed mode with XVFB"
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' wopee_agent &
        else
          wopee_agent &
        fi
        wait $!

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-results
        path: |
          ${{ env.WOPEE_AGENT_WORK_DIR }}/test-results
          ${{ env.WOPEE_AGENT_WORK_DIR }}/playwright-report
          /tmp/proxy.out
          /tmp/chrome.out
          /tmp/socat-proxy.out
          /tmp/socat-viewer.out
        if-no-files-found: ignore
        retention-days: 1

    - name: Export Test Report to WOPEE_AGENT_REPORT
      shell: bash
      run: |
        set -euo pipefail

        REPORT_PATH="${WOPEE_AGENT_WORK_DIR}/test-results/report.md"
        if [ -f "$REPORT_PATH" ]; then
          REPORT_CONTENT="$(cat "$REPORT_PATH")"
        else
          REPORT_CONTENT="Agent report not found at $REPORT_PATH"
          echo "⚠️ $REPORT_CONTENT"
        fi

        {
          echo "WOPEE_AGENT_REPORT<<EOF"
          echo "$REPORT_CONTENT"
          echo "EOF"
        } >> "$GITHUB_ENV"

    - name: Post-process suites if agent did not run
      if: always() && steps.run-agent.outcome != 'success'
      shell: bash
      run: |
        set -euo pipefail

        # pw-agent writes this marker only after the server confirmed post-processing.
        # If it exists, the suite is already finalized (the agent step may still have
        # failed for other reasons) — a second error:true post-process would wrongly
        # mark it failed/stopped.
        if [ -f "${WOPEE_AGENT_WORK_DIR:-}/test-results/.wopee-postprocess-ok" ]; then
          echo "Post-process already confirmed by the agent; skipping fallback"
          exit 0
        fi

        if [ -z "${WOPEE_API_URL:-}" ] || [ -z "${WOPEE_API_KEY:-}" ]; then
          echo "WARNING: WOPEE_API_URL or WOPEE_API_KEY is missing; skipping fallback post-process"
          exit 0
        fi

        ERROR_FLAG=true
        AGENT_REPORT_STATUS="FAILED"
        AGENT_LOG_JSON="[]"
        CODE_STEPS_TEXT=""

        QUERY_ANALYSIS='mutation PostProcessAnalysisSuite($input: PostProcessAnalysisSuiteInput!) { postProcessAnalysisSuite(input: $input) { postProcessing errorMessage } }'
        QUERY_AGENT='mutation PostProcessAgentSuite($input: PostProcessAgentSuiteInput!) { postProcessAgentSuite(input: $input) { postProcessing codeGeneration { status message } testCaseStepsGeneration { status message } errorMessage } }'

        HAS_IDENTIFIER=false
        IDENTIFIER=""
        if [ -n "${WOPEE_USER_STORY_ID:-}" ] && [ -n "${WOPEE_TEST_CASE_ID:-}" ]; then
          IDENTIFIER="${WOPEE_USER_STORY_ID}:${WOPEE_TEST_CASE_ID}"
          HAS_IDENTIFIER=true
        fi

        if [ "${{ github.event.action }}" = "crawl" ] || [ "$HAS_IDENTIFIER" != "true" ]; then
          JSON_PAYLOAD="$(jq -n \
            --arg query "$QUERY_ANALYSIS" \
            --arg projectUuid "${WOPEE_PROJECT_UUID:-}" \
            --arg suiteUuid "${WOPEE_SUITE_UUID:-}" \
            --arg agentReport "${WOPEE_AGENT_REPORT:-}" \
            --arg agentReportStatus "$AGENT_REPORT_STATUS" \
            --argjson error "$ERROR_FLAG" \
            '{
              query: $query,
              variables: {
                input: {
                  error: $error,
                  projectUuid: $projectUuid,
                  suiteUuid: $suiteUuid,
                  agentReport: $agentReport,
                  agentReportStatus: $agentReportStatus
                }
              }
            }'
          )"
        else
          # A test-case run that ended before its result reached Wopee has no verdict: INCOMPLETE,
          # not a failure of the product (backlog#4453). The analysis branch above keeps FAILED —
          # postProcessAnalysisSuite gates on it. Mirrors pw-agent's pool fallback
          # (agents/pool/postProcessFallback.ts + unconfirmedRunReport): the report may carry a
          # verdict the agent wrote before it died, so its status lines are rewritten to match
          # BEFORE the note is appended — a report must not contradict its own status.
          AGENT_REPORT="${WOPEE_AGENT_REPORT:-}"
          if [ "${DISABLE_INCOMPLETE_VERDICT:-}" != "true" ]; then
            AGENT_REPORT_STATUS="INCOMPLETE"
            AGENT_REPORT="$(printf '%s\n' "$AGENT_REPORT" | sed -E \
              -e 's/Test Status:[[:space:]]*[^[:alpha:]]*(Passed|Failed|Incomplete)/Test Status: ⚠️ Incomplete/I' \
              -e 's/\*\*Verdict:[[:space:]]*(PASSED|FAILED|INCOMPLETE)\*\*/**Verdict: INCOMPLETE**/I')"
            AGENT_REPORT="${AGENT_REPORT}

        ### ⚠️ The run ended before its result reached Wopee

        The agent process stopped — it crashed, was cancelled or ran out of time — before its
        result was confirmed. The run is therefore recorded as INCOMPLETE: it establishes nothing
        about the application under test, in either direction."
          fi

          JSON_PAYLOAD="$(jq -n \
            --arg query "$QUERY_AGENT" \
            --arg projectUuid "${WOPEE_PROJECT_UUID:-}" \
            --arg suiteUuid "${WOPEE_SUITE_UUID:-}" \
            --arg identifier "$IDENTIFIER" \
            --arg agentReport "$AGENT_REPORT" \
            --arg agentReportStatus "$AGENT_REPORT_STATUS" \
            --arg agentLog "$AGENT_LOG_JSON" \
            --arg codeSteps "$CODE_STEPS_TEXT" \
            --argjson error "$ERROR_FLAG" \
            '{
              query: $query,
              variables: {
                input: {
                  error: $error,
                  projectUuid: $projectUuid,
                  suiteUuid: $suiteUuid,
                  identifier: $identifier,
                  agentReport: $agentReport,
                  agentReportStatus: $agentReportStatus,
                  agentLog: $agentLog,
                  codeSteps: $codeSteps
                }
              }
            }'
          )"
        fi

        curl --fail-with-body --silent --show-error \
          --request POST --max-time 30 \
          --retry 3 --retry-delay 2 \
          --header "content-type: application/json" \
          --header "api_key: ${WOPEE_API_KEY}" \
          --url "${WOPEE_API_URL}" \
          --data "$JSON_PAYLOAD"

    - name: Delete Traefik YAML
      if: always() && env.AGENT_MODE == 'interactive'
      shell: bash
      run: |
        RID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        rm -f "/dynamic/${RID}.yml" || true
